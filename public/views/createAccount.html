<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body class="bg-slate-100 min-h-screen flex flex-col">
        <nav class="bg-white w-full h-22 border-b border-gray-300 shadow-xs flex items-center">
            <a href="/"><img src="../properties/images/zahev_logo_1.png" class="h-16 w-auto hover:cursor-pointer ml-5"/></a>
        </nav>

        <div class="flex-1 flex items-center justify-center">
            <div class="w-3/4 max-w-[400px] min-h-[475px] bg-white border border-gray-300 rounded-lg shadow-sm flex flex-col items-center justify-between gap-5 p-6">
                <form id="loginForm" class="w-full">
                    <div class="w-full space-y-6">
                        <div>
                            <h1 class="font-medium text-2xl text-slate-950">Create your Account</h1>
                            <p class="font-medium text-xs text-gray-700 mb-4">
                                Start tracking your spending in minutes
                            </p>
                        </div>
                        <div class="flex flex-col gap-2 mt-7">
                            <p class="text-sm font-medium text-gray-700">E-mail</p>
                            <input 
                                type="text" 
                                placeholder="e.g Johnvacation@email.com" 
                                class="w-full h-10 border border-gray-300 rounded-lg px-3 text-gray-500 focus:outline-none focus:ring-2 focus:ring-slate-900"
                            />
                            <p class="text-sm font-medium text-gray-700">Username</p>
                            <input 
                                type="text" 
                                placeholder="e.g Johnsmith123" 
                                class="w-full h-10 border border-gray-300 rounded-lg px-3 text-gray-500 focus:outline-none focus:ring-2 focus:ring-slate-900"
                            />
                            <p class="text-sm font-medium text-gray-700">Password</p>
                            <input 
                                type="password" 
                                placeholder="Create a password" 
                                class="w-full h-10 border border-gray-300 rounded-lg px-3 text-gray-500 focus:outline-none focus:ring-2 focus:ring-slate-900"
                            />
                            <button type="submit" class="w-full h-10 bg-slate-900 mt-4 rounded-lg text-neutral-100 font-medium hover:cursor-pointer hover:bg-slate-700">Sign Up</button>
                        </div>
                        <div>
                            <p class="text-sm font-light text-gray-500 text-center">
                                Already have an account? 
                                <a href="/login" class="underline hover:text-slate-900">Log in</a>
                            </p>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
